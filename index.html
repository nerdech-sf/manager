<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nerdech — 社内ナレッジ集約AI</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a6cf5'/%3E%3Crect x='13' y='13' width='6' height='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg-blue:#4a6cf5;
    --card:#ffffff;
    --panel:#f7f8fa;
    --panel-2:#eef1f6;
    --line:#e8eaf0;
    --line-2:#e2e5ec;
    --text:#20232b;
    --text-2:#5b6270;
    --text-3:#8a90a0;
    --accent:#4a6cf5;
    --accent-soft:#e9edfe;
    --accent-lav:#dfe4fc;
    --hover:#f0f2f7;
    --active:#eef1f7;
    --danger:#d1453b;
    --danger-soft:#fdeeed;
    --warn:#f2b01e;
    --cream:#fdf6e3;
    --cream-b:#efe4bf;
    --font:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",-apple-system,system-ui,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg-blue);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:14.5px;line-height:1.7}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit}
  svg{display:inline-block;vertical-align:middle}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#cdd2dd;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#b6bcca;background-clip:padding-box}
  .hidden{display:none!important}

  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .fu-s{animation:fadeUp .55s cubic-bezier(.16,.7,.3,1) both;animation-delay:var(--d,0s)}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .loading{display:inline-flex;gap:5px;padding:4px 0}
  .loading i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite both}
  .loading i:nth-child(2){animation-delay:.2s}.loading i:nth-child(3){animation-delay:.4s}
  .cursor-blink{display:inline-block;margin-left:1px;color:var(--accent);animation:blink 1s step-end infinite}
  @keyframes ndFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .nd-fade{animation:ndFadeUp .5s ease both}
  @keyframes ndDotBlink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .nd-dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
  .nd-dots span{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.2;animation:ndDotBlink 1.2s ease-in-out infinite}
  .nd-dots span:nth-child(2){animation-delay:.2s}
  .nd-dots span:nth-child(3){animation-delay:.4s}

  /* ===================== シェル(Frame 20) ===================== */
  .app{height:100vh;display:flex;background:var(--bg-blue)}
  .rail{
    width:92px;flex:0 0 92px;display:flex;flex-direction:column;align-items:center;
    padding:56px 0 16px;gap:20px;color:#fff;
  }
  .rail-item{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;border-radius:12px;padding:2px;transition:.12s}
  .rail-item:hover .rail-ic{background:rgba(255,255,255,.16)}
  .rail-ic{width:44px;height:42px;display:grid;place-items:center;border-radius:12px;color:#fff;transition:.12s}
  .rail-ic svg{width:23px;height:23px}
  .rail-item.active .rail-ic{background:var(--accent-lav);color:var(--bg-blue)}
  .rail-item.active:hover .rail-ic{background:var(--accent-lav)}
  .rail-ic.boxed{border:1.6px solid rgba(255,255,255,.85)}
  .rail-lbl{font-size:11.5px;line-height:1.3;text-align:center;font-weight:600;letter-spacing:.02em;color:#fff}
  .rail-spacer{flex:1}
  .rail-avatar{width:46px;height:46px;border-radius:13px;background:#fff;display:grid;place-items:center;color:var(--bg-blue);cursor:pointer;transition:.12s}
  .rail-avatar:hover{transform:translateY(-2px)}
  .rav-initial{font-size:19px;font-weight:700;color:var(--bg-blue)}

  .col{flex:1;min-width:0;display:flex;flex-direction:column}
  /* 上部バー = ウェブアプリのヘッダー(ウィンドウ操作ボタンは廃止し、ブランドと状態を表示) */
  .titlebar{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff}
  .tb-brand{display:flex;align-items:center;gap:9px;min-width:0}
  .tb-logo{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
  .tb-logo svg{width:15px;height:15px}
  .tb-name{font-size:13.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-tag{font-size:11px;font-weight:600;opacity:.72;border-left:1px solid rgba(255,255,255,.4);padding-left:9px;white-space:nowrap}
  .tb-right{display:flex;align-items:center;gap:10px;flex:none}
  .tb-user{font-size:12.5px;font-weight:600;color:#fff;display:flex;align-items:center;gap:7px}
  .tb-user .tb-dot{width:7px;height:7px;border-radius:50%;background:#7ee2a8;flex:none}
  .tb-badge{font-size:11px;font-weight:600;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:7px;padding:3px 10px}
  .sheet{flex:1;min-height:0;background:var(--card);border-radius:26px 0 0 0;display:flex;overflow:hidden}
  .view-full{flex:1;min-width:0;min-height:0}
  .view-scroll{overflow-y:auto}

  /* ログイン画面はサイドバー(レール)を出さず、独立した1画面にする */
  .app.auth .rail{display:none}
  .app.auth .sheet{border-radius:0}

  /* ユーザーメニュー */
  #userMenu{
    position:fixed;left:100px;bottom:22px;z-index:80;background:#fff;border:1px solid var(--line-2);
    border-radius:14px;box-shadow:0 12px 40px rgba(20,30,60,.18);padding:16px 18px;min-width:200px;
    animation:ndFadeUp .2s ease both;
  }
  #userMenu .um-name{font-size:14.5px;font-weight:700}
  #userMenu .um-title{font-size:12px;color:var(--text-3);margin:2px 0 12px}
  #userMenu .um-logout{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:8px;font-size:13px;color:var(--text-2);transition:.12s}
  #userMenu .um-logout:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}

  /* トースト */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:90;
    background:#20232b;color:#fff;font-size:13px;padding:10px 20px;border-radius:12px;
    opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ===================== ログイン ===================== */
  .login{flex:1;display:grid;grid-template-columns:1.05fr .95fr;min-height:0}
  .login-left{padding:clamp(36px,5vw,68px);display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .bdot{width:9px;height:9px;border-radius:3px;background:var(--accent)}
  .brand b{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .login-copy{margin:auto 0}
  .login-headline{font-size:clamp(1.9rem,3.4vw,2.7rem);font-weight:700;line-height:1.5;letter-spacing:-.01em;margin-bottom:16px}
  .login-headline em{font-style:normal;color:var(--accent);border-bottom:3px solid var(--accent-lav)}
  .login-lede{color:var(--text-2);font-size:15px}
  .demo-badge{font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-lav);border-radius:8px;padding:6px 12px;align-self:flex-start}
  .login-right{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--panel)}
  .login-card{width:100%;max-width:360px;background:#fff;border:1px solid var(--line-2);border-radius:18px;padding:30px 28px;box-shadow:0 8px 40px rgba(20,30,60,.06)}
  .login-card h2{font-size:19px;font-weight:700;margin-bottom:22px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11.5px;color:var(--text-3);font-weight:600;margin-bottom:6px;letter-spacing:.08em}
  .field input{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 13px;font-size:14.5px;transition:.15s;background:#fff}
  .field input:focus{outline:none;border-color:#b9c6f5;box-shadow:0 0 0 3px rgba(74,108,245,.1)}
  .lerr{color:var(--danger);font-size:12.5px;min-height:18px;margin:2px 0 6px}
  .lbtn{width:100%;background:var(--accent);color:#fff;border-radius:11px;padding:12px;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .lbtn:hover:not(:disabled){background:#3a58d6}
  .lbtn:disabled{opacity:.5;cursor:default}
  .demo-accts{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
  .demo-accts .dh{font-size:11.5px;color:var(--text-3);font-weight:600;margin-bottom:8px;letter-spacing:.04em}
  .da{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border-radius:10px;padding:9px 10px;transition:.12s}
  .da:hover{background:var(--hover)}
  .da .av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
  .da .meta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
  .da .meta .nm{font-weight:600;font-size:13.5px}
  .da .meta .ti{font-size:11.5px;color:var(--text-3)}
  .da .go{color:var(--text-3)}
  .da:hover .go{color:var(--accent)}

  /* ===================== ナビカード(Frame 2の第2カラム) ===================== */
  .nav{
    width:252px;flex:0 0 252px;background:#fff;margin:12px 0 0 12px;
    border:1px solid var(--line-2);border-bottom:none;border-radius:16px 16px 0 0;
    display:flex;flex-direction:column;min-height:0;
  }
  .seg{display:flex;gap:2px;margin:12px 12px 6px;background:var(--panel-2);border-radius:10px;padding:3px}
  .seg button{flex:1;font-size:12.5px;font-weight:600;color:var(--text-2);padding:6px 4px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;gap:5px;transition:.12s;white-space:nowrap}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(20,30,60,.12)}
  .seg svg{width:13px;height:13px}
  .nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 12px}
  .nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--text);font-weight:500;cursor:pointer}
  .nav-link:hover{background:var(--hover)}
  .nav-link svg{width:16px;height:16px;color:var(--text-2);flex:0 0 16px}
  .nav-link.muted{color:var(--text-2)}
  .nav-sec{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px;font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.05em}
  .nav-sec .plus{width:20px;height:20px;display:grid;place-items:center;border-radius:5px;color:var(--text-3);font-size:14px}
  .nav-sec .plus:hover{background:var(--hover);color:var(--text)}
  .nav-empty{font-size:12px;color:var(--text-3);padding:8px 10px;line-height:1.7}
  .recent{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--text);cursor:pointer}
  .recent:hover{background:var(--hover)}
  .recent.active{background:var(--active);font-weight:600}
  .recent .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--text-2);cursor:pointer}
  .ch:hover{background:var(--hover);color:var(--text)}
  .ch.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .ch .hash{font-size:16px;color:var(--text-3);width:16px;text-align:center}
  .ch.active .hash{color:var(--accent)}
  .ch .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch .badge{margin-left:auto;background:#e5484d;color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center}
  .gstack-wrap{display:flex;margin-left:6px}
  .gstack{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;margin-left:-6px;border:1.5px solid #fff}
  .avatar{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;position:relative}
  .avatar .pres{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid #fff;background:#8a90a0}
  .avatar .pres.on{background:#31c56a}

  /* ===================== チャット メイン ===================== */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
  .main-head{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 20px;gap:14px}
  .main-head.dm{border-bottom:1px solid var(--line)}
  .mode-toggle{display:flex;background:var(--panel-2);border-radius:11px;padding:3px}
  .mode-toggle button{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text-2);padding:7px 16px;border-radius:9px;transition:.12s;white-space:nowrap}
  .mode-toggle button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(20,30,60,.14)}
  .mode-toggle svg{width:15px;height:15px}
  .head-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;min-width:0}
  .head-title .hash{color:var(--text-3);font-size:19px}
  .head-sub{font-size:12px;color:var(--text-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-actions{margin-left:auto;display:flex;gap:4px;color:var(--text-2)}
  .stream{flex:1;min-height:0;overflow-y:auto}
  .feed-inner{max-width:780px;margin:0 auto;padding:22px 28px 30px}

  .intro{text-align:center;padding:44px 0 28px}
  .intro h2{font-size:clamp(1.25rem,2.2vw,1.6rem);font-weight:700;margin-bottom:10px}
  .intro p{color:var(--text-2);font-size:14px;max-width:460px;margin:0 auto}
  .tpl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
  .tpl button{background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:9px 16px;font-size:13px;color:var(--text-2);font-weight:500;transition:.15s}
  .tpl button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

  .msg{margin-bottom:20px;animation:fadeUp .45s cubic-bezier(.16,.7,.3,1) both}
  .msg.u{display:flex;justify-content:flex-end}
  .msg.u .bubble{background:var(--accent);color:#fff;padding:11px 17px;border-radius:16px 16px 4px 16px;max-width:80%;font-size:14.5px;line-height:1.7}
  .acard{background:#fff;border:1px solid var(--line-2);border-radius:16px;overflow:hidden}
  .acard .ahead{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .acard .ahead .ai{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--accent)}
  .acard .ahead .lbl{font-weight:600;font-size:13.5px}
  .acard .ahead .pill{margin-left:auto;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2)}
  .pill.ok{color:#1f9d55;border-color:#bfe6cf;background:#f0faf4}
  .acard .body{padding:16px 18px;white-space:pre-wrap;font-size:14.5px;line-height:1.9}
  .acard.blocked{border-color:#f2c9c5}
  .blockwrap{padding:18px}
  .blockwrap .bigicon{width:42px;height:42px;border-radius:11px;background:var(--danger-soft);border:1px solid #f2c9c5;display:grid;place-items:center;margin-bottom:12px}
  .blockwrap h4{margin:0 0 8px;font-size:15.5px;color:var(--danger);font-weight:700}
  .blockwrap p{margin:0;color:var(--text-2);font-size:13.5px;line-height:1.9}
  .blockwrap .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .bmeta{font-size:12px;color:var(--text-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 11px}
  .bmeta b{color:var(--text)}
  .src{padding:0 18px 16px}
  .src .h{font-size:12px;color:var(--text-3);font-weight:600;margin:10px 0 8px;display:flex;align-items:center;gap:7px;letter-spacing:.04em}
  .src .item{display:flex;gap:11px;align-items:center;padding:10px 13px;border:1px solid var(--line-2);border-radius:11px;margin-bottom:7px;cursor:pointer;transition:.15s}
  .src .item:hover{border-color:var(--accent);transform:translateX(3px)}
  .src .item .di{width:28px;height:28px;border-radius:8px;background:var(--panel);color:var(--text-2);display:grid;place-items:center;flex:none}
  .src .item .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .src .item .tt .t1{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .src .item .tt .t2{font-size:11.5px;color:var(--text-3)}
  .src .item .acl{font-size:11px;color:var(--text-2);border:1px solid var(--line-2);border-radius:7px;padding:3px 8px;white-space:nowrap}

  /* ---- DMメッセージ ---- */
  .msgs{max-width:900px;margin:0 auto;padding:18px 26px 24px}
  .day-div{display:flex;align-items:center;gap:14px;margin:16px 0;color:var(--text-3);font-size:11.5px;font-weight:600}
  .day-div::before,.day-div::after{content:"";height:1px;background:var(--line);flex:1}
  .dm-empty{text-align:center;color:var(--text-3);font-size:13px;padding:30px 0}
  .msg-dm{display:flex;gap:12px;padding:7px 8px;border-radius:10px}
  .msg-dm:hover{background:var(--panel)}
  .msg-body{flex:1;min-width:0}
  .msg-head{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
  .msg-name{font-size:13.5px;font-weight:700}
  .msg-dm.me .msg-name{color:var(--accent)}
  .msg-time{font-size:11px;color:var(--text-3)}
  .msg-text{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .file-card{margin-top:8px;max-width:380px;display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;background:#fff}
  .file-ic{width:40px;height:40px;flex:0 0 40px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em}
  .file-meta{min-width:0;flex:1}
  .file-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-size{font-size:11.5px;color:var(--text-3);margin-top:1px}
  .file-dl{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);flex:0 0 34px;font-size:17px;text-decoration:none}
  .file-dl:hover{background:var(--hover);color:var(--accent)}
  .img-att{margin-top:8px;max-width:340px;border-radius:12px;border:1px solid var(--line);display:block;cursor:zoom-in}

  /* ---- コンポーザー ---- */
  .composer{padding:10px 26px 18px;background:#fff;transition:.15s}
  .composer.drag{background:#f3f6ff}
  .composer-inner{max-width:900px;margin:0 auto}
  .attach-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .attach-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:6px 8px 6px 10px;font-size:12px}
  .attach-chip .asize{color:var(--text-3)}
  .attach-chip .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--text-3);font-size:11px}
  .attach-chip .x:hover{background:#e8eaf0;color:var(--text)}
  .inputbox{border:1px solid var(--line-2);border-radius:15px;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .inputbox:focus-within{border-color:#b9c6f5;box-shadow:0 0 0 3px rgba(74,108,245,.1)}
  .input-top{display:flex;align-items:flex-end;padding:6px 8px 6px 16px}
  .input-top textarea{flex:1;border:none;outline:none;resize:none;font-size:14.5px;line-height:1.6;padding:9px 0;max-height:150px;color:var(--text);background:transparent}
  .input-top textarea::placeholder{color:var(--text-3)}
  .send-btn{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;color:var(--text-3);margin-bottom:3px;transition:.12s}
  .send-btn.ready{background:var(--accent);color:#fff}
  .send-btn.ready:hover{background:#3a58d6}
  .send-btn.busy{opacity:.5;pointer-events:none}
  .send-btn svg{width:18px;height:18px}
  .input-bar{display:flex;align-items:center;gap:6px;padding:6px 10px 8px}
  .tool-pill{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text-2);background:var(--cream);border:1px solid var(--cream-b);padding:4px 10px;border-radius:8px;white-space:nowrap}
  .tool-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-2)}
  .tool-ic:hover{background:var(--hover);color:var(--text)}
  .tool-ic svg{width:17px;height:17px}
  .input-bar .right{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:12px;font-weight:600;white-space:nowrap}

  /* lightbox */
  .lightbox{position:fixed;inset:0;background:rgba(10,14,30,.72);display:none;place-items:center;z-index:50;padding:40px}
  .lightbox.show{display:grid}
  .lightbox img{max-width:90vw;max-height:88vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5)}

  /* ===================== 引用元プレビュー(原本モーダル) ===================== */
  .dp-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
  .dp-modal.show{display:flex}
  .dp-overlay{position:absolute;inset:0;background:rgba(15,20,43,.6)}
  .dp-box{position:relative;z-index:2;background:#fff;border:1px solid var(--line-2);border-radius:18px;max-width:720px;width:100%;max-height:82vh;display:flex;flex-direction:column;animation:ndFadeUp .22s ease both}
  .dp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 26px 16px;border-bottom:1px solid var(--line);flex:none}
  .dp-title{font-size:17.5px;font-weight:700;line-height:1.5;word-break:break-all}
  .dp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .dp-close{flex:none;width:30px;height:30px;border:1px solid var(--line-2);border-radius:9px;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:.15s}
  .dp-close:hover{color:var(--text);border-color:var(--text-3)}
  .dp-body{padding:18px 26px 24px;overflow:auto}
  .dp-summary{font-size:13.5px;color:var(--text-2);line-height:1.9;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .dp-content{font-size:14px;line-height:1.9;white-space:pre-wrap}
  .dp-loading,.dp-error{font-size:13.5px;color:var(--text-3);padding:8px 2px}
  .mtag{font-size:11.5px;padding:4px 9px;border-radius:7px;background:var(--panel);color:var(--text-2);border:1px solid var(--line-2)}
  .mtag.mtag-gap{border-color:#f2c9c5;color:var(--danger);background:var(--danger-soft)}
  .mtag.mtag-thin{border-color:#eeddb0;color:#a07a10;background:var(--cream)}

  /* ===================== マネージャー(ナレッジの見取り図) ===================== */
  .mgr-wrap{display:grid;grid-template-columns:230px 1fr 300px;height:100%}
  .mgr-aside{border-right:1px solid var(--line);padding:20px;overflow:auto}
  .mgr-aside h3{font-size:11.5px;color:var(--text-3);font-weight:700;margin:0 0 12px;letter-spacing:.08em}
  .flt{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .flt input{margin-top:4px;accent-color:var(--accent)}
  .flt .fdot{width:9px;height:9px;border-radius:3px;flex:none;margin-top:6px}
  .flt .flabel{font-size:13px;font-weight:600;color:var(--text)}
  .flt .fsub{font-size:11px;color:var(--text-3);line-height:1.6}
  .flt .fcount{margin-left:auto;font-size:12px;color:var(--text-3)}
  .mgr-toggle{display:flex;gap:2px;background:var(--panel-2);border-radius:10px;padding:3px;margin-bottom:16px}
  .mgr-toggle button{flex:1;font-size:12.5px;font-weight:600;color:var(--text-2);padding:7px 0;border-radius:8px;transition:.12s;white-space:nowrap}
  .mgr-toggle button.active{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(20,30,60,.12)}
  .mgr-view-toggle{margin-bottom:20px}
  .mgr-main{overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:22px;min-width:0;min-height:0}
  .mgr-main.is-graph{align-items:stretch}
  .mgr-graph-embed{flex:1;width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:16px}
  .mgr-main .cakehead{width:100%;max-width:640px;display:flex;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
  .mgr-main .cakehead .ttl{font-size:16px;font-weight:700}
  .mgr-main .cakehead .cap{font-size:11.5px;color:var(--text-3);margin-left:10px}
  .addfile-btn{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;transition:.15s}
  .addfile-btn:hover{background:#3a58d6}
  .addfile-btn:disabled{opacity:.5;cursor:default}
  /* 図形を利用可能領域(幅・高さ)に必ず収める: 箱を残り高さに広げ、SVGはmeetで全体表示。
     デスクトップ前提の固定サイズをやめ、ウェブの任意幅でも見切れないようにする。 */
  .cakebox{position:relative;flex:1 1 auto;min-height:0;width:100%;max-width:900px;display:flex;align-items:center;justify-content:center}
  .cakesvg{width:100%;height:100%;display:block;user-select:none}
  .cake-hint{font-size:11px;color:var(--text-3);text-align:center;margin-top:4px}
  .cake-tip{position:fixed;z-index:40;pointer-events:none;background:#20232b;color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;opacity:0;transition:opacity .2s ease;max-width:230px;line-height:1.6}
  .cake-tip.show{opacity:1}
  .cake-tip b{color:#fff;font-weight:600;display:block;margin-bottom:2px;word-break:break-all}
  .cake-tip span{color:#b9c0d4}
  .cake-insp{position:fixed;left:346px;bottom:16px;width:300px;z-index:16;background:#fff;border:1px solid var(--line-2);border-radius:16px;padding:20px;box-shadow:0 14px 44px rgba(20,30,60,.16);opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}
  .cake-insp.show{opacity:1;transform:none;pointer-events:auto}
  .insp-close{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line-2);color:var(--text-3);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
  .insp-close:hover{color:var(--text);border-color:var(--text-3)}
  .insp-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
  .insp-icon{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
  .insp-name{font-size:15px;font-weight:700;line-height:1.4;word-break:break-all}
  .insp-crumb{font-size:11.5px;color:var(--text-3);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .insp-crumb .d{width:7px;height:7px;border-radius:50%}
  .insp-crumb i{color:var(--text-3);font-style:normal}
  .insp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .insp-sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin:10px 0 6px}
  .mgr-timeline{border-left:1px solid var(--line);padding:20px;overflow:auto}
  .mgr-timeline h3{font-size:11.5px;color:var(--text-3);font-weight:700;margin:0 0 5px;letter-spacing:.08em}
  .mgr-timeline .tcount{font-size:12px;color:var(--text-3);margin-bottom:14px}
  .tl-month{font-size:12px;color:var(--text-3);font-weight:600;margin:16px 0 8px}
  .tl-month:first-of-type{margin-top:0}
  .tl-item{display:flex;gap:9px;align-items:flex-start;padding:9px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.15s}
  .tl-item:hover,.tl-item.hl{background:var(--panel);border-color:var(--line-2)}
  .tl-item .tdot{width:8px;height:8px;border-radius:3px;flex:none;margin-top:6px}
  .tl-item .tinfo{flex:1;min-width:0}
  .tl-item .ttitle{font-size:13px;font-weight:600;word-break:break-all}
  .tl-item .tmeta{font-size:11px;color:var(--text-3);margin-top:2px}
  .tl-item .ttier{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
  .tl-summary{font-size:11.5px;color:var(--text-2);margin-top:5px;line-height:1.7;display:none}
  .tl-item.hl .tl-summary{display:block}

  /* つながりグラフ */
  .struct-desc{font-size:12.5px;color:var(--text-2);line-height:1.9;margin:0 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .struct-legend-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
  .struct-legend-item .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .struct-legend-item .name{flex:1;font-size:13px;font-weight:600}
  .struct-legend-item .count{font-size:12px;color:var(--text-3)}
  .struct-svg{width:100%;height:100%;display:block;cursor:grab}
  .struct-svg.panning{cursor:grabbing}
  .struct-hint{position:absolute;right:14px;bottom:12px;font-size:10.5px;color:var(--text-3);pointer-events:none;user-select:none}
  .struct-node{cursor:pointer}
  .struct-node circle{transition:r .25s ease,fill-opacity .25s ease,stroke-width .25s ease}
  .struct-node text{pointer-events:none;font-family:var(--font);fill:var(--text-2)}
  #gEdges line{transition:opacity .25s ease}
  .struct-tooltip{position:fixed;z-index:40;pointer-events:none;background:#20232b;color:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;max-width:240px;opacity:0;transition:opacity .2s ease;line-height:1.6}
  .struct-tooltip.show{opacity:1}
  .struct-tooltip b{display:block;font-weight:600;margin-bottom:3px;word-break:break-all}
  .struct-tooltip span{color:#b9c0d4;display:block;margin-top:2px}
  .struct-detail-empty{font-size:13px;color:var(--text-3);line-height:1.9}
  .struct-detail-title{font-size:16px;font-weight:700;line-height:1.55;margin-bottom:10px}
  .struct-detail-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .struct-detail-summary{font-size:13px;color:var(--text-2);line-height:1.9;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .struct-detail-links h4{font-size:11px;color:var(--text-3);letter-spacing:.08em;font-weight:700;margin:0 0 8px}
  .struct-link-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;transition:.15s}
  .struct-link-item:hover{transform:translateX(4px);color:var(--accent)}
  .struct-link-item .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .struct-link-item .w{margin-left:auto;font-size:11px;color:var(--text-3)}
  .struct-empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-3);gap:10px;text-align:center;padding:0 24px}
  .struct-empty-state .big{font-size:17px;color:var(--text-2);font-weight:700}

  /* ===================== 業務構造(業務フロー) ===================== */
  .biz-empty{display:flex;align-items:center;justify-content:center;height:100%;padding:24px}
  .biz-empty-inner{max-width:520px;text-align:center}
  .biz-empty-inner h2{font-size:clamp(1.3rem,2.4vw,1.7rem);font-weight:700;margin:0 0 14px}
  .biz-empty-inner p{color:var(--text-2);font-size:14px;line-height:2;margin:0 0 28px}
  .biz-gen-btn,.biz-regen-btn{background:var(--accent);color:#fff;border-radius:12px;padding:14px 28px;font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
  .biz-gen-btn:hover:not(:disabled),.biz-regen-btn:hover:not(:disabled){background:#3a58d6}
  .biz-gen-btn:disabled,.biz-regen-btn:disabled{opacity:.5;cursor:default}
  .biz-regen-btn{padding:9px 18px;font-size:13px}
  .biz-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;color:var(--text-2)}
  .biz-loading p{font-size:13px}
  .biz-page{display:grid;grid-template-columns:1fr 300px;height:100%}
  .biz-main{display:flex;flex-direction:column;padding:22px clamp(16px,3vw,32px);min-height:0;min-width:0}
  .biz-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line);flex:none}
  .biz-head-title{min-width:0}
  .biz-head-actions{display:flex;align-items:center;gap:12px;flex:none;flex-wrap:wrap}
  .biz-title{font-size:clamp(1.15rem,2vw,1.5rem);font-weight:700;line-height:1.5}
  .biz-sub{font-size:12px;color:var(--text-3);margin-top:5px}
  .biz-agg-toggle{margin-bottom:0;flex:none;width:150px}
  .biz-canvas-wrap{position:relative;flex:1;min-height:0;background:#10142b;border-radius:16px;overflow:hidden;transition:opacity .18s ease}
  .biz-canvas-wrap.fading{opacity:0}
  .biz-canvas{width:100%;height:100%;display:block;cursor:grab}
  .biz-canvas.panning{cursor:grabbing}
  .biz-node{cursor:pointer;transition:opacity .25s ease}
  .biz-node .biz-core{transition:r .2s ease,fill-opacity .2s ease}
  .biz-node .biz-glow{transition:r .2s ease,fill-opacity .2s ease}
  .biz-label{fill:#f2f5ff;font-family:var(--font);font-size:13px;font-weight:600;text-anchor:middle}
  .biz-doc-count-label{fill:rgba(235,240,255,.55);font-family:var(--font);font-size:10.5px;text-anchor:middle;letter-spacing:.02em}
  .biz-issue-label{font-family:var(--font);font-size:10.5px;text-anchor:middle;letter-spacing:.04em}
  .biz-issue-label.gap{fill:#ff8c82}
  .biz-issue-label.thin{fill:rgba(235,240,255,.55)}
  .biz-hint{position:absolute;right:14px;bottom:12px;font-size:10.5px;color:rgba(235,240,255,.4);pointer-events:none;user-select:none}
  .biz-detail{border-left:1px solid var(--line);padding:22px;overflow:auto}
  .biz-detail h3{font-size:11.5px;color:var(--text-3);font-weight:700;margin:0 0 14px;letter-spacing:.08em}
  .biz-note{margin:2px 0 16px;font-size:12.5px;line-height:1.85;color:var(--danger);background:var(--danger-soft);border:1px solid #f2c9c5;border-radius:11px;padding:11px 13px}
  .biz-note.thin{color:#a07a10;background:var(--cream);border-color:var(--cream-b)}
  .biz-preview-btn{margin-top:16px;background:#fff;border:1px solid var(--line-2);color:var(--text-2);border-radius:10px;padding:9px 15px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .biz-preview-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* ===================== 分析 ===================== */
  .analysis-wrap{padding:30px clamp(16px,4vw,40px) 60px;max-width:880px;margin:0 auto}
  .analysis-head h2{font-size:clamp(1.2rem,2.1vw,1.55rem);font-weight:700;margin:0 0 8px}
  .analysis-head p{color:var(--text-2);font-size:13.5px;margin:0 0 22px}
  .analysis-stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .analysis-stat{background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:16px 20px;min-width:140px}
  .analysis-stat .k{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.04em}
  .analysis-stat .v{font-size:27px;font-weight:700;margin-top:4px;color:var(--accent)}
  .analysis-doctypes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:30px}
  .analysis-section-label{font-size:11px;color:var(--text-3);letter-spacing:.1em;margin-bottom:10px;font-weight:700;text-transform:uppercase}
  .analysis-card{background:#fff;border:1px solid var(--line-2);border-radius:16px;padding:22px 24px;margin-bottom:20px}
  .analysis-card .ac-role{font-size:16.5px;font-weight:700;margin-bottom:8px}
  .analysis-card .ac-summary{font-size:14px;line-height:1.9;color:var(--text-2);margin-bottom:14px}
  .analysis-card .ac-sec{margin-bottom:12px}
  .analysis-card .ac-sec-label{display:block;font-size:11px;letter-spacing:.08em;color:var(--text-3);font-weight:700;margin-bottom:5px}
  .analysis-card .ac-sec ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.85;color:var(--text)}
  .analysis-card .ac-sec.risk .ac-sec-label,.analysis-card .ac-sec.risk ul{color:var(--danger)}
  .analysis-card .ac-suggestion{font-size:13.5px;line-height:1.85;border-top:1px solid var(--line);padding-top:12px;color:var(--text-2)}
  .analysis-empty{color:var(--text-2);font-size:13.5px;line-height:1.9;background:var(--panel);border:1px dashed var(--line-2);border-radius:14px;padding:18px 20px}
  .tag{display:inline-block;font-size:11.5px;border-radius:7px;padding:3px 10px;background:var(--panel);border:1px solid var(--line-2);color:var(--text-2);font-weight:500;margin:2px 3px 0 0}

  /* ===================== 管理コンソール ===================== */
  .admin-guard{display:flex;align-items:center;justify-content:center}
  .ag-inner{text-align:center;max-width:440px;padding:24px}
  .ag-mark{width:52px;height:52px;border-radius:14px;background:var(--danger-soft);border:1px solid #f2c9c5;display:grid;place-items:center;margin:0 auto 18px}
  .ag-inner h2{font-size:18px;font-weight:700;margin-bottom:10px}
  .ag-inner p{font-size:13.5px;color:var(--text-2);line-height:2}
  .admin-container{max-width:1080px;margin:0 auto;padding:26px 24px 60px}
  .admin-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .admin-head h1{font-size:21px;font-weight:700}
  .admin-org{font-size:12.5px;color:var(--text-3)}
  .atabs{display:flex;gap:4px;background:var(--panel-2);border-radius:12px;padding:4px;margin-bottom:22px;flex-wrap:wrap}
  .atabs button{font-size:13px;font-weight:600;color:var(--text-2);padding:8px 16px;border-radius:9px;transition:.12s;white-space:nowrap}
  .atabs button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(20,30,60,.14)}
  .tabpanel{display:none}
  .tabpanel.on{display:block}
  .admin-view h2{font-size:15.5px;font-weight:700;margin:26px 0 12px}
  .admin-view h2:first-child{margin-top:0}
  .panel{background:#fff;border:1px solid var(--line-2);border-radius:16px;overflow:hidden}
  .tablewrap{width:100%;overflow-x:auto}
  table{width:100%;min-width:640px;border-collapse:collapse}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
  th{color:var(--text-3);font-weight:600;font-size:11.5px;letter-spacing:.05em;background:var(--panel)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:var(--panel)}
  .acl{font-size:12.5px;color:var(--text-2)}
  .blk{color:var(--danger);font-weight:600}
  .okq{color:#1f9d55;font-weight:600}
  .src2{font-size:12.5px;color:var(--text-3)}
  .muted{color:var(--text-3);font-size:13px}
  p.muted{margin:10px 2px 0}
  .btn{border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--text-2);transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.danger{color:var(--danger)}
  .btn.danger:hover{border-color:var(--danger);background:var(--danger-soft)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#3a58d6;color:#fff}
  .btn:disabled{opacity:.4;cursor:default;pointer-events:none}
  .row-actions{white-space:nowrap}
  .editbox{background:var(--panel);border:1px solid var(--line-2);border-radius:11px;padding:12px;margin:6px 0}

/* デモの質問応答。回答/権限ブロック/資料なしを判定して監査ログにも記録する */
function demoAsk(query, user){
  const q=(query||'').toLowerCase();
  let hit=null;
  for(const rule of DEMO_QA){
    if(rule.keys.every(k=>q.includes(k.toLowerCase()))){ hit=rule; break; }
  }
  // ルールに当たらなければ、タイトル/要約/本文の部分一致で拾う
  let docs=[];
  if(hit){
    docs=hit.docIds.map(id=>DEMO_DOCS.find(d=>d.id===id)).filter(Boolean);
  }else{
    const tokens=q.split(/[\s、。・？?！!の は を に で と…]+/).filter(t=>t.length>=2);
    docs=DEMO_DOCS.filter(d=>tokens.some(t=>(d.title+d.summary+d.content).toLowerCase().includes(t)));
  }
  const visible=docs.filter(d=>d.acl.some(g=>user.groups.includes(g)));
  const visCount=demoVisibleDocs(user).length;

  let res;
  if(docs.length && !visible.length){
    res={blocked:true, gap:false, answer:'あなたの権限では、この質問に該当する社内資料を参照できません。', sources:[],
      user:{name:user.name,title:user.title}, visible_docs:visCount, total_docs:DEMO_DOCS.length};
  }else if(!docs.length){
    res={blocked:false, gap:true, answer:'該当する社内資料が見つかりませんでした。この質問は「ナレッジの穴」として記録され、管理コンソールのFAQ化候補に表示されます。', sources:[],
      visible_docs:visCount, total_docs:DEMO_DOCS.length};
  }else{
    const answer = hit ? hit.answer
      : `「${visible[0].title.replace(/(?:\.[A-Za-z0-9]{1,5}){1,3}$/,'')}」によると——\n${visible[0].content.split('\n')[0]}`;
    res={blocked:false, gap:false, answer,
      sources:visible.slice(0,3).map(d=>({doc_id:d.id, title:d.title, source:d.source, acl_label:demoAclLabel(d.acl)})),
      visible_docs:visCount, total_docs:DEMO_DOCS.length};
  }
  DEMO_AUDIT.push({
    at:new Date().toISOString(), user_id:user.id, user_name:user.name, query,
    blocked:res.blocked, gap:!!res.gap,
    cited:(res.sources||[]).map(s=>s.title), cited_ids:(res.sources||[]).map(s=>s.doc_id),
    visible_docs:visCount, total_docs:DEMO_DOCS.length,
  });
  return res;
}

/* 監査ログから集計(ダッシュボード・メンバー統計) */
function demoDailySeries(filterFn){
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    days.push({date:key, count:0, blocked:0, gap:0});
  }
  DEMO_AUDIT.filter(filterFn||(()=>true)).forEach(l=>{
    const key=l.at.slice(0,10);
    const day=days.find(x=>x.date===key);
    if(!day) return;
    day.count++;
    if(l.blocked) day.blocked++;
    if(l.gap) day.gap++;
  });
  return days;
}
function demoAuditPayload(){
  const log=DEMO_AUDIT.slice().reverse();
  const total=DEMO_AUDIT.length;
  const blocked=DEMO_AUDIT.filter(l=>l.blocked).length;
  const gap=DEMO_AUDIT.filter(l=>l.gap).length;
  const recent=DEMO_AUDIT.slice(-20);
  const byQ={};
  DEMO_AUDIT.forEach(l=>{
    const k=l.query;
    (byQ[k]=byQ[k]||{question:k,count:0,last_user:'',last_asked:'',gap:l.gap}).count++;
    byQ[k].last_user=l.user_name; byQ[k].last_asked=l.at; byQ[k].gap=byQ[k].gap&&l.gap;
  });
  const allQ=Object.values(byQ);
  const cite={};
  DEMO_AUDIT.forEach(l=>(l.cited_ids||[]).forEach(id=>{cite[id]=(cite[id]||0)+1;}));
  const typeDist={};
  Object.entries(cite).forEach(([id,c])=>{
    const d=DEMO_DOCS.find(x=>x.id===id); if(!d) return;
    typeDist[d.doc_type]=(typeDist[d.doc_type]||0)+c;
  });
  return {
    log,
    stats:{
      total, answered:total-blocked-gap, blocked, knowledge_gap:gap,
      recent_window:{n:recent.length,
        answered:recent.filter(l=>!l.blocked&&!l.gap).length,
        blocked:recent.filter(l=>l.blocked).length,
        gap:recent.filter(l=>l.gap).length},
    },
    org_daily: demoDailySeries(),
    top_questions: allQ.filter(x=>!x.gap).sort((a,b)=>b.count-a.count).slice(0,8),
    knowledge_gaps: allQ.filter(x=>x.gap).sort((a,b)=>b.count-a.count).slice(0,6),
    doc_type_distribution: Object.entries(typeDist).map(([doc_type,count])=>({doc_type,count})).sort((a,b)=>b.count-a.count),
    top_cited_docs: Object.entries(cite).map(([id,count])=>{
      const d=DEMO_DOCS.find(x=>x.id===id);
      return {title:d?d.title:id, doc_type:d?d.doc_type:'', count};
    }).sort((a,b)=>b.count-a.count).slice(0,6),
    thin_citation_count: DEMO_AUDIT.filter(l=>(l.cited_ids||[]).length===1).length,
  };
}

const mkRes=(status,data)=>({ok:status<300, status, json:async()=>data});

let DEMO_STRUCTURE_GENERATED=true; // 最初から生成済みで見せる
let demoDocSeq=100;

async function demoApi(url, opts){
  opts=opts||{};
  const method=(opts.method||'GET').toUpperCase();
  const path=url.split('?')[0];
  const body=(()=>{ try{ return typeof opts.body==='string'?JSON.parse(opts.body):null; }catch(e){ return null; } })();

  // 認証不要

    const u=DEMO_USERS.find(x=>x.username===(body&&body.username));
    if(!u||u.password!==(body&&body.password)) return mkRes(401,{error:'ユーザー名またはパスワードが違います'});
    return mkRes(200,{token:'demo-'+u.id});
  }

    user:{id:user.id,name:user.name,title:user.title,role:user.role,groups:user.groups,
      group_labels:user.groups.map(g=>{const gg=DEMO_GROUPS.find(x=>x.id===g);return gg?gg.label:g;})},

    DEMO_DOCS.push({id:'d'+(demoDocSeq++), title, doc_type:'一般', importance:'deliverable',
      acl:user.groups.filter(g=>g!=='g_all').concat(['g_all']).slice(0,1).length?['g_all']:['g_all'],
      source:'Web取込', chunks:Math.max(1,Math.round((content.length||3000)/800)),
      size_bytes:(f&&f.size)||3000, updated_at:new Date().toISOString(),
      summary:'Webからアップロードされた資料。', content:content||'（プレビュー可能な本文がありません）'});

    await new Promise(r=>setTimeout(r,1600));

    if(!d) return mkRes(404,{error:'not found'});
    if(!d.acl.some(g=>user.groups.includes(g))) return mkRes(403,{error:'forbidden'});
    return mkRes(200,{title:d.title,doc_type:d.doc_type,importance:d.importance,updated_at:d.updated_at,
      source:d.source,summary:d.summary,content:d.content});

    groups:DEMO_GROUPS.slice()});
  if(path==='/api/admin/users'&&method==='POST'){
    if(!body||!body.username) return mkRes(400,{error:'ログイン名は必須です'});

  if(mUser){

    if(!u) return mkRes(404,{error:'not found'});
    if(method==='PUT'){
      Object.assign(u,{name:body.name??u.name,title:body.title??u.title,username:body.username??u.username,
        role:body.role??u.role,groups:body.groups??u.groups});
      if(body.password) u.password=body.password;
      return mkRes(200,{ok:true});
    }
    if(method==='DELETE'){
      const i=DEMO_USERS.indexOf(u); DEMO_USERS.splice(i,1);

  if(path==='/api/admin/groups'&&method==='POST'){
    if(!body||!body.id||!body.label) return mkRes(400,{error:'IDと表示名を入力してください'});
    if(DEMO_GROUPS.some(g=>g.id===body.id)) return mkRes(400,{error:'そのIDは使われています'});

  if(path==='/api/admin/insights'&&method==='POST'){

    return mkRes(200, DEMO_INSIGHTS);
  }
  if(path==='/api/admin/documents'&&method==='POST'){
    const fd=opts.body;
    const f=fd&&fd.get?fd.get('file'):null;
    if(!f) return mkRes(400,{error:'ファイルを選んでください'});
    const title=(fd.get('title')||'').trim()||f.name;
    const acl=((fd.get('acl')||'')+'').split(',').filter(Boolean);

    try{ if(/\.(txt|md|markdown|csv|json|log|html?)$/i.test(f.name)) content=await f.text(); }catch(e){}
    DEMO_DOCS.push({id:'d'+(demoDocSeq++), title, doc_type:'一般', importance:'reference',
      acl:acl.length?acl:['g_all'], source:'管理者アップロード',
      chunks:Math.max(1,Math.round((content.length||3000)/800)), size_bytes:f.size||3000,
      updated_at:new Date().toISOString(), summary:'管理コンソールから取り込まれた資料。',
      content:content||'（プレビュー可能な本文がありません）'});
    return mkRes(200,{ok:true});
  }
  const mDoc=path.match(/^\/api\/admin\/documents\/([^/]+)$/);
  if(mDoc){
    const d=DEMO_DOCS.find(x=>x.id===decodeURIComponent(mDoc[1]));
    if(!d) return mkRes(404,{error:'not found'});
    if(method==='PUT'){ d.title=body.title??d.title; d.acl=body.acl??d.acl; return mkRes(200,{ok:true}); }
    if(method==='DELETE'){ DEMO_DOCS.splice(DEMO_DOCS.indexOf(d),1); return mkRes(200,{ok:true}); }
  }

  return mkRes(404,{error:'not found: '+path});
}

function countUp(elm, to, duration){
  if(!elm) return;
  to=Number(to)||0; duration=duration||800;
  const start=performance.now();
  const step=now=>{
    const p=Math.min(1,(now-start)/duration);
    elm.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  if(g.includes('g_hr'))return '#a24bd8';
  if(g.includes('g_dev'))return '#22a06b';
  return '#5b6270';
}
function dateLabel(iso){const d=new Date(iso);
  return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function monthLabel(iso){const d=new Date(iso);return `${d.getFullYear()}年${d.getMonth()+1}月`}
function fmtSize(b){ if(!b) return '—'; if(b>=1e9)return (b/1e9).toFixed(1)+' GB'; if(b>=1e6)return (b/1e6).toFixed(1)+' MB'; if(b>=1e3)return Math.round(b/1e3)+' KB'; return b+' B'; }

let _toastTimer=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }

  _toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

function openDocPreview(docId){
  docId=(docId||'').toString().trim();
  if(!docId) return;
  const modal=document.getElementById('docPreviewModal');
  modal.innerHTML=`<div class="dp-overlay"></div>
    <div class="dp-box" role="dialog" aria-modal="true" aria-label="資料プレビュー">
      <div class="dp-head"><div><div class="dp-title">読み込み中…</div></div>
        <button class="dp-close" aria-label="閉じる" type="button">${ICON.x}</button></div>
      <div class="dp-body"><div class="dp-loading"><span class="loading"><i></i><i></i><i></i></span></div></div>
    </div>`;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  modal.querySelector('.dp-overlay').onclick=closeDocPreview;
  modal.querySelector('.dp-close').onclick=closeDocPreview;
  fetchDocPreview(docId);
}
async function fetchDocPreview(docId){
  const modal=document.getElementById('docPreviewModal');
  try{
    const r=await apiFetch('/api/documents/'+encodeURIComponent(docId)+'/preview',{headers:authHeaders()});
    if(r.status===401){ closeDocPreview(); toast('セッションが切れました'); return logout(); }
    if(!modal.classList.contains('show')) return;
    if(!r.ok){
      const head=modal.querySelector('.dp-head');
      if(head) head.querySelector('.dp-title').textContent='資料が見つかりません';
      const body=modal.querySelector('.dp-body');
      if(body) body.innerHTML='<div class="dp-error">この資料は表示できません（権限がないか、削除された可能性があります）。</div>';
      return;
    }
    const d=await r.json();
    if(!modal.classList.contains('show')) return;
    modal.querySelector('.dp-head').innerHTML=`
      <div><div class="dp-title">${esc(stripExt(d.title))}</div>
        <div class="dp-meta">
          <span class="mtag">${esc(d.doc_type||'一般')}</span>
          <span class="mtag">${esc(dpImportanceLabel(d.importance))}</span>
          <span class="mtag">${esc(dateLabel(d.updated_at))}</span>
          <span class="mtag">${esc(d.source||'')}</span>
        </div>
      </div>
      <button class="dp-close" aria-label="閉じる" type="button">${ICON.x}</button>`;
    modal.querySelector('.dp-close').onclick=closeDocPreview;
    modal.querySelector('.dp-body').innerHTML=`
      ${d.summary?`<div class="dp-summary">${esc(d.summary)}</div>`:''}
      <div class="dp-content">${esc(d.content||'（本文がありません）')}</div>`;
  }catch(e){
    if(!modal.classList.contains('show')) return;
    const body=modal.querySelector('.dp-body');
    if(body) body.innerHTML='<div class="dp-error">読み込みに失敗しました。</div>';
  }
}
function closeDocPreview(){
  const modal=document.getElementById('docPreviewModal');
  if(!modal) return;
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden','true');
  modal.innerHTML='';
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){

    if(modal && modal.classList.contains('show')) closeDocPreview();

});

  err.textContent='';

  btn.disabled=true;
  try{
    const r=await apiFetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});

    if(!r.ok){err.textContent=d.error||'ログインに失敗しました';btn.disabled=false;return;}

/* ---- 質問(実バックエンド:SSE / デモ:内蔵QAを擬似ストリーミング) ---- */
async function ask(text){
  const q=(text||'').trim();
  if(!q) return;
  ensureSession(q);
  const feed=document.getElementById('feed');
  const intro=feed.querySelector('.intro'); if(intro) intro.remove();
  feed.insertAdjacentHTML('beforeend',`<div class="msg u"><div class="bubble">${esc(q)}</div></div>`);
  const loadId='l'+Date.now();
  feed.insertAdjacentHTML('beforeend',`<div class="msg a" id="${loadId}"><div class="acard"><div class="ahead"><span class="ai">${ICON.spark}</span><span class="lbl">回答を生成中</span></div><div class="body"><span class="loading"><i></i><i></i><i></i></span></div></div></div>`);
  const sc=document.getElementById('aiStream'); sc.scrollTop=sc.scrollHeight;
  const send=document.getElementById('sendBtn'); send.classList.add('busy');

  const finish=()=>{ send.classList.remove('busy'); saveCurrentSession();
    const sc2=document.getElementById('aiStream'); if(sc2) sc2.scrollTop=sc2.scrollHeight; };

  if(DEMO){
    // デモ: 内蔵QAで判定し、1文字ずつ流す
    await new Promise(r=>setTimeout(r,650));
    const res=demoAsk(q, DEMO_USERS.find(u=>u.id===ME.id));
    const elCard=document.getElementById(loadId);
    if(res.blocked){
      elCard.outerHTML=`<div class="msg a">${blockedCardHtml(res)}</div>`;
      finish(); return;
    }
    let shown='';
    const srcHtml=srcHtmlFrom(res.sources);
    const render=(done)=>{
      const c=document.getElementById(loadId);
      if(!c) return;
      c.innerHTML=`<div class="acard"><div class="ahead"><span class="ai">${ICON.spark}</span><span class="lbl">回答</span>${done&&!res.gap?`<span class="pill ok">${ICON.check} 権限OK</span>`:''}</div>`+
        `<div class="body">${esc(shown)}${done?'':'<span class="cursor-blink">▍</span>'}</div>${done?srcHtml:''}</div>`;
      if(done) bindSrcClicks(c);
      const s2=document.getElementById('aiStream'); if(s2) s2.scrollTop=s2.scrollHeight;
    };
    for(let i=0;i<res.answer.length;i+=3){
      shown=res.answer.slice(0,i+3);
      render(false);
      await new Promise(r=>setTimeout(r,18));
    }
    shown=res.answer; render(true);
    finish(); return;
  }

  /* 実バックエンド: SSEストリーミング(旧実装を踏襲) */
  let streamedText='', metaData=null, doneData=null, sawError=false, streamStarted=false;
  const renderStreaming=()=>{
    const elc=document.getElementById(loadId);
    if(!elc) return;
    const srcHtml=(metaData&&!metaData.blocked)?srcHtmlFrom(metaData.sources):'';
    elc.innerHTML=`<div class="acard"><div class="ahead"><span class="ai">${ICON.spark}</span><span class="lbl">回答</span></div>`
      +`<div class="body">${esc(streamedText)}<span class="cursor-blink">▍</span></div>${srcHtml}</div>`;
    bindSrcClicks(elc);
    const sc2=document.getElementById('aiStream'); if(sc2) sc2.scrollTop=sc2.scrollHeight;
  };
  try{
    const STREAM_BASE=location.hostname.endsWith('.web.app')?'https://knowledge-ai-api-135815080966.asia-northeast1.run.app':'';
    const r=await fetch(STREAM_BASE+'/api/ask/stream',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({query:q})});
    if(r.status===401){toast('セッションが切れました');return logout();}
    if(!r.ok||!r.body) throw new Error('stream-failed');
    const reader=r.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    while(true){
      const {value,done}=await reader.read();
      if(done) break;
      buf+=decoder.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,idx); buf=buf.slice(idx+2);
        let ev='message',data='';
        raw.split('\n').forEach(line=>{
          if(line.startsWith('event:')) ev=line.slice(6).trim();
          else if(line.startsWith('data:')) data+=line.slice(5).trim();
        });
        if(!data) continue;
        let parsed; try{parsed=JSON.parse(data);}catch(e){continue;}
        if(ev==='meta'){ metaData=parsed; if(!metaData.blocked){streamStarted=true;renderStreaming();} }
        else if(ev==='delta'){ streamedText+=parsed.text||''; streamStarted=true; renderStreaming(); }
        else if(ev==='done'){ doneData=parsed; }
        else if(ev==='error'){ sawError=true; }
      }
    }
    const elc=document.getElementById(loadId);
    if(sawError||!doneData){
      if(elc) elc.querySelector('.body').textContent='エラーが発生しました';
    }else if(doneData.blocked){
      const u=(metaData&&metaData.user)||{name:ME.name,title:ME.title||''};
      const vis=metaData?metaData.visible_docs:VIS, tot=metaData?metaData.total_docs:TOT;
      if(elc) elc.outerHTML=`<div class="msg a">${blockedCardHtml({answer:doneData.answer,user:u,visible_docs:vis,total_docs:tot})}</div>`;
    }else{
      const srcHtml=srcHtmlFrom(doneData.sources);
      const html=`<div class="acard"><div class="ahead"><span class="ai">${ICON.spark}</span><span class="lbl">回答</span><span class="pill ok">${ICON.check} 権限OK</span></div><div class="body">${esc(doneData.answer)}</div>${srcHtml}</div>`;
      if(elc){ elc.outerHTML=`<div class="msg a" id="${loadId}">${html}</div>`; bindSrcClicks(document.getElementById(loadId)); }
    }
  }catch(e){
    const elc=document.getElementById(loadId);
    if(elc){
      if(streamStarted) elc.querySelector('.body').textContent='エラーが発生しました';
      else elc.outerHTML=`<div class="msg a"><div class="acard"><div class="ahead"><span class="ai">${ICON.spark}</span><span class="lbl">回答</span></div><div class="body">エラーが発生しました</div></div></div>`;
    }
  }
  finish();
}
function blockedCardHtml(res){
  const u=res.user||{name:ME.name,title:ME.title||''};
  return `<div class="acard blocked"><div class="blockwrap">
    <div class="bigicon">${ICON.lock}</div>
    <h4>アクセスが遮断されました</h4>
    <p>${esc(res.answer)||'あなたの権限では、この質問に該当する社内資料を参照できません。'}</p>
    <div class="meta"><span class="bmeta">閲覧者：<b>${esc(u.name)}（${esc(u.title)}）</b></span><span class="bmeta">参照可能な資料：<b>${res.visible_docs} / ${res.total_docs} 件</b></span></div>

}

const SLAB_T=66;

const LAYER_SCALE=[1.0,0.80,0.62];
const layerFactor=pos=>0.72+0.28*LAYER_SCALE[pos];

function proj(rho, thetaDeg, pos){
  const ca=Math.cos(azimuth), sa=Math.sin(azimuth);
  const r=rho*LAYER_SCALE[pos];
  const a=thetaDeg*Math.PI/180;
  const fx=r*Math.sin(a), fy=r*Math.cos(a);
  const gx=fx*ca-fy*sa, gy=fx*sa+fy*ca;
  const br=RHO1*LAYER_SCALE[pos], ba=Math.PI/4;
  const bfx=br*Math.sin(ba), bfy=br*Math.cos(ba);
  const bgx=bfx*ca-bfy*sa, bgy=bfx*sa+bfy*ca;
  const offX=-(bgx*SX+bgy*DEPTH_X);
  const x=APEX.x+gx*SX+gy*DEPTH_X+offX;
  const y=APEX.y-gy*DEPTH_Y-pos*LAYER_H;
  return [x,y];
}
function sampleArc(rho,t0,t1,pos,n){const out=[];for(let i=0;i<=n;i++)out.push(proj(rho,t0+(t1-t0)*i/n,pos));return out;}
const ptsToPath=(pts,close)=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+(close?' Z':'');

let NODES={};
const nodeR=nd=>13*layerFactor(nd.pos);

function computeGraph(){
  const docs=visibleDocs();
  const times=docs.map(d=>+new Date(d.updated_at));
  const tMax=times.length?Math.max(...times):0, tMin=times.length?Math.min(...times):0, tRange=(tMax-tMin)||1;
  NODES={};
  const lo=THETA0+8, hi=THETA1-8;
  [0,1,2].forEach(tier=>{
    const fs=docs.filter(d=>tierNumOf(d)===tier);
    const m=fs.length;
    fs.forEach((d,k)=>{
      const theta = m>1 ? lo+(k/(m-1))*(hi-lo) : (lo+hi)/2;
      const pos=2-tier;
      const age=(tMax-(+new Date(d.updated_at)))/tRange;
      const rho=RHO0+age*(RHO1-RHO0)+(k%2?7:-7);
      const [x,y]=proj(rho,theta,pos);
      NODES[d.id]={doc:d, tier, pos, theta, rho, x, y};
    });
  });
}

let VB={x:0,y:0,s:900};
function buildGraph(){
  const svgEl=document.getElementById('cake');
  if(!svgEl) return;
  svgEl.innerHTML='';
  const g=el('g',{}); svgEl.appendChild(g);
  const slabTopFill=['#ffffff','#fbfcfe','#f6f9fc'];
  const slabSideFill=['#dde4ec','#dde4ec','#dde4ec'];
  for(let pos=0;pos<3;pos++){
    const far=sampleArc(RHO1,THETA0,THETA1,pos,30);
    const near=sampleArc(RHO0,THETA1,THETA0,pos,16);
    const top=far.concat(near);
    const frontLine=[proj(RHO1,THETA1,pos)].concat(sampleArc(RHO0,THETA1,THETA0,pos,16)).concat([proj(RHO1,THETA0,pos)]);
    const frontDown=frontLine.map(p=>[p[0],p[1]+SLAB_T]).reverse();
    const gs=el('g',{});
    gs.appendChild(el('path',{d:ptsToPath(frontLine.concat(frontDown),true), fill:slabSideFill[pos], stroke:'#c3ccd8','stroke-width':'1.4','stroke-linejoin':'round'}));
    gs.appendChild(el('path',{d:ptsToPath(top,true), fill:slabTopFill[pos], stroke:'#c3ccd8','stroke-width':'1.4','stroke-linejoin':'round'}));
    g.appendChild(gs);
    const [lx,ly]=proj(RHO1,THETA0,pos);
    const t=TIER_DEF[TIER_BY_ID[2-pos]];
    const t1=el('text',{x:lx-14,y:ly-2,'text-anchor':'end','font-size':'16','font-weight':'700',fill:'#2a3340'}); t1.textContent=t.label;
    const t2=el('text',{x:lx-14,y:ly+15,'text-anchor':'end','font-size':'11','font-weight':'500',fill:'#9aa4b1'}); t2.textContent=t.sub;
    g.appendChild(t1); g.appendChild(t2);
  }
  const [ax,ay]=proj(0,0,0);
  const [ox,oy]=proj(RHO1,45,0);
  const an1=el('text',{x:ax+8,y:ay+SLAB_T+24,'text-anchor':'start','font-size':'12.5','font-weight':'500',fill:'#b2bac6'}); an1.textContent='新しい（中心）';
  const an2=el('text',{x:ox+10,y:oy-8,'text-anchor':'start','font-size':'12.5','font-weight':'500',fill:'#b2bac6'}); an2.textContent='古い（外周）';
  g.appendChild(an1); g.appendChild(an2);

  if(MGR_AGG){
    buildClusters(g);
    g.appendChild(el('g',{id:'cakeFx'}));
  } else {
    const gN=el('g',{id:'cakeNodes'});
    Object.values(NODES).sort((m,n)=>(m.pos-n.pos)||(n.rho-m.rho)).forEach(nd=>{
      const col=typeColor(nd.doc.doc_type||'一般');
      const c=el('circle',{cx:nd.x,cy:nd.y,r:nodeR(nd),fill:col,stroke:'#ffffff','stroke-width':'2.4',tabindex:'0',role:'button'});
      c.style.cursor='pointer';
      c.dataset.id=nd.doc.id;
      c.setAttribute('aria-label',`${nd.doc.title}｜${nd.doc.doc_type||'一般'}｜${TIER_DEF[tierOf(nd.doc.importance)].label}`);
      const ttl=el('title',{}); ttl.textContent=`${nd.doc.title} — ${nd.doc.doc_type||'一般'} / ${TIER_DEF[tierOf(nd.doc.importance)].label}`; c.appendChild(ttl);
      const enter=()=>{ if(!cakeSelected){ cakeHover=nd.doc.id; cakeRender(); } };
      const leave=()=>{ if(!cakeSelected){ cakeHover=null; cakeRender(); } hideTip(); };
      c.addEventListener('mouseenter', ev=>{ enter(); showTipEvent(ev,nd); });
      c.addEventListener('mousemove', ev=>moveTip(ev));
      c.addEventListener('mouseleave', leave);
      c.addEventListener('focus', ()=>{ enter(); showTipNode(nd); });
      c.addEventListener('blur', leave);
      const toggle=()=>{ cakeSelected = cakeSelected===nd.doc.id?null:nd.doc.id; cakeRender(); };
      c.addEventListener('click', ev=>{ ev.stopPropagation(); toggle(); });
      c.addEventListener('keydown', ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); toggle(); } });
      gN.appendChild(c);
    });
    g.appendChild(gN);
    g.appendChild(el('g',{id:'cakeFx'}));
  }
  fitViewBox();
}
function fitViewBox(){
  const svgEl=document.getElementById('cake');
  const bb=svgEl.getBBox(); const pad=30;
  let x=bb.x-pad,y=bb.y-pad,w=bb.width+2*pad,h=bb.height+2*pad;
  const s=Math.max(w,h);
  x-=(s-w)/2; y-=(s-h)/2;
  svgEl.setAttribute('viewBox', `${x.toFixed(1)} ${y.toFixed(1)} ${s.toFixed(1)} ${s.toFixed(1)}`);
  VB={x,y,s};
}
function buildClusters(g){
  const groups={};
  Object.values(NODES).forEach(nd=>{
    const key=nd.tier+'|'+(nd.doc.doc_type||'一般');
    (groups[key]=groups[key]||{tier:nd.tier,kind:nd.doc.doc_type||'一般',nodes:[]}).nodes.push(nd);
  });
  const byTier={0:[],1:[],2:[]};
  Object.values(groups).forEach(grp=>byTier[grp.tier].push(grp));
  const gC=el('g',{});
  [0,1,2].forEach(tier=>{
    const arr=byTier[tier];
    const m=arr.length, lo=THETA0+12, hi=THETA1-12, pos=2-tier;
    arr.forEach((grp,i)=>{
      const theta=m>1?lo+(i/(m-1))*(hi-lo):(lo+hi)/2;
      const rho=grp.nodes.reduce((s,n)=>s+n.rho,0)/grp.nodes.length;
      const [x,y]=proj(rho,theta,pos);
      const cnt=grp.nodes.length;
      const r=Math.max(13,Math.min(46,10+Math.sqrt(cnt)*7))*layerFactor(pos);
      const c=el('circle',{cx:x,cy:y,r:r,fill:typeColor(grp.kind),stroke:'#fff','stroke-width':'2.5'});
      c.style.cursor='pointer';
      c.addEventListener('mouseenter',ev=>tipCluster(ev,grp,cnt));
      c.addEventListener('mousemove',ev=>moveTip(ev));
      c.addEventListener('mouseleave',hideTip);
      gC.appendChild(c);
      const t=el('text',{x:x,y:y,'text-anchor':'middle','dominant-baseline':'central',fill:'#fff','font-weight':'700'});
      t.setAttribute('font-size', cnt>=100?13:15); t.textContent=cnt;
      gC.appendChild(t);
    });
  });
  g.appendChild(gC);
}
function tipCluster(ev,grp,cnt){
  document.getElementById('cakeTip').innerHTML=`<b>${esc(grp.kind)} × ${esc(TIER_DEF[TIER_BY_ID[grp.tier]].label)}</b><span>${cnt}件</span>`;
  document.getElementById('cakeTip').classList.add('show'); moveTip(ev);
}

function tipFill(nd){ document.getElementById('cakeTip').innerHTML=`<b>${esc(stripExt(nd.doc.title))}</b><span>${esc(nd.doc.doc_type||'一般')} · ${esc(TIER_DEF[tierOf(nd.doc.importance)].label)} · ${esc(dateLabel(nd.doc.updated_at))}</span>`; }
function clampTip(x,y){ x=Math.max(8,Math.min(x, innerWidth-244)); y=Math.max(8,Math.min(y, innerHeight-58)); return [x,y]; }
function showTipEvent(ev,nd){ tipFill(nd); document.getElementById('cakeTip').classList.add('show'); moveTip(ev); }
function showTipNode(nd){
  tipFill(nd); const t=document.getElementById('cakeTip'); t.classList.add('show');
  const svgEl=document.getElementById('cake'); const r=svgEl.getBoundingClientRect();
  const [x,y]=clampTip(r.left+(nd.x-VB.x)/VB.s*r.width+16, r.top+(nd.y-VB.y)/VB.s*r.height+16);
  t.style.left=x+'px'; t.style.top=y+'px';
}
function moveTip(ev){ const [x,y]=clampTip(ev.clientX+16, ev.clientY+16); const t=document.getElementById('cakeTip'); t.style.left=x+'px'; t.style.top=y+'px'; }
function hideTip(){ const t=document.getElementById('cakeTip'); if(t) t.classList.remove('show'); }
